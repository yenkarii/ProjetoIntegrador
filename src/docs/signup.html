<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - BioCosmetics</title>
    <link rel="stylesheet" href="main.css">

</head>

<body class="pagina-signup">

    <div class="signup-container">

        <h1>🌿 BioCosmetics</h1>

        <h2>Bem-vindo a BioCosmetics!</h2>
        <p>Faça seu cadastro já!</p>

        <form id="form-signup">
            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" placeholder="Digite seu nome completo" required>

            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="Digite seu e-mail" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Digite sua senha" required>

            <label for="cpf">CPF</label>
            <input type="text" id="cpf" placeholder="Digite seu CPF" required>

            <label class="mostrar-senha">
                <input type="checkbox" id="mostrarSenha">
                Mostrar senha
            </label>

            <button type="submit">Cadastrar</button>

        </form>
        <p style="padding: 10px;" class="redirect-login">
            Já possui um cadastro? <span><a href="login.html">Entrar</a></span>
        </p>

        <p class="voltar">
            <a href="index.html">Voltar para a loja</a>
        </p>

    </div>

    <script>
        // pega os elementos do html pelo id deles
        const formulario = document.getElementById("form-signup");
        const senhaInput = document.getElementById("senha");
        const mostrarSenha = document.getElementById("mostrarSenha");

        // faz o checkbox de "mostrar senha" funcionar
        mostrarSenha.addEventListener("change", function () {
            if (mostrarSenha.checked) {
                senhaInput.type = "text";
            } else {
                senhaInput.type = "password";
            }
        });

        formulario.addEventListener("submit", async function (event) {
            event.preventDefault();

            // pega o texto dos campos de email e senha e salva eles em uma const
            const nome = document.getElementById("nome").value.trim();
            const email = document.getElementById("email").value.trim();
            const senha = senhaInput.value.trim();
            const cpf = document.getElementById("cpf").value.replace(/\D/g, "").trim();

            try {
                // fetch é o "carteiro" do navegador. leva os dados até a rota designada do MVC importada no server.js :)

                const respGet = await fetch("http://localhost:3000/clientes");
                const clientes = await respGet.json();
                const clienteEncontrado = clientes.find(c => c.email === email || c.cpf === cpf);

                if (clienteEncontrado) {
                    alert("E-mail/CPF já cadastrado! Tente outro.");
                } else {
                    const respPost = await fetch("http://localhost:3000/clientes", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({ nome, email, senha, cpf })
                    });

                    const dados = await respPost.json();

                    if (respPost.ok) {
                        alert("Cadastro realizado com sucesso!");
                        window.location.href = "login.html";
                    } else {
                        alert(dados.erro || "Erro ao cadastrar cliente!");
                    }
                }
            } catch (erro) {
                console.error("Erro na requisição:", erro);
                alert("Erro ao conectar com o servidor. Veja se o server.js está rodando!");
            }
        });
    </script>

</body>

</html>
