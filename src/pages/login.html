<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BioCosmetics</title>
    <link rel="stylesheet" href="main.css">
    <link rel="shortcut icon" href="favicon.webp" type="image/x-icon">
</head>

<body class="pagina-login">

    <div class="login-container">

        <h1>🌿 BioCosmetics</h1>

        <h2>Bem-vindo de volta!</h2>
        <p>Entre na sua conta para continuar.</p>

        <form id="form-login">

            <label for="email">E-mail</label>
            <input
                type="email"
                id="email"
                placeholder="Digite seu e-mail"
                required
            >

            <label for="senha">Senha</label>
            <input
                type="password"
                id="senha"
                placeholder="Digite sua senha"
                required
            >

            <label class="mostrar-senha">
                <input type="checkbox" id="mostrarSenha">
                Mostrar senha
            </label>

            <button type="submit">Entrar</button>

        </form>
         <p style="padding: 10px;" class="redirect-signup">
            Não possui um cadastro? <span><a href="signup.html">Cadastre-se</a></span>
        </p>

        <p class="voltar">
            <a href="index.html">Voltar para a loja</a>
        </p>

    </div>

    <script>
        // pega os elementos do html pelo id deles
        const formulario = document.getElementById("form-login");
        const senhaInput = document.getElementById("senha");
        const mostrarSenha = document.getElementById("mostrarSenha");

        // faz o checkbox de "mostrar senha" funcionar
        mostrarSenha.addEventListener("change", function() {
            if (mostrarSenha.checked) {
                senhaInput.type = "text";
            } else {
                senhaInput.type = "password";
            }
        });

        formulario.addEventListener("submit", async function(event) {
            event.preventDefault();

            // pega o texto dos campos de email e senha e salva eles em uma const
            const email = document.getElementById("email").value.trim();
            const senha = senhaInput.value.trim();

            try{
                // fetch é o "carteiro" do navegador. leva os dados até a rota designada do MVC importada no server.js :)

                const resp = await fetch("http://localhost:3000/clientes");
                const clientes = await resp.json();
                const clienteEncontrado = clientes.find(c => c.email === email && c.senha === senha)

                if(clienteEncontrado){
                    localStorage.setItem("clienteLogado", JSON.stringify(clienteEncontrado));
                    alert("Login realizado!");
                    window.location.href = "index.html";
                } else {
                    alert("E-mail ou senha incorretos!");
                }
            } catch(erro){
                console.error("Erro ao conectar:", erro);
                alert("Erro ao conectar com o servidor. Veja se o server.js está rodando!");
            }
        });
    </script>

</body>
</html>
