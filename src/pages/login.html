
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BioCosmetics</title>
    <link rel="stylesheet" href="main.css">
</head>

<body class="pagina-login">

    <div class="login-container">

        <h1>🌿 BioCosmetics</h1>

        <h2>Bem-vindo de volta!</h2>
        <p>Entre na sua conta para continuar.</p>

        <form id="form-login">

            <label for="email">E-mail</label>
            <input
                type="email"
                id="email"
                placeholder="Digite seu e-mail"
                required
            >

            <label for="senha">Senha</label>
            <input
                type="password"
                id="senha"
                placeholder="Digite sua senha"
                required
            >

            <label class="mostrar-senha">
                <input type="checkbox" id="mostrarSenha">
                Mostrar senha
            </label>

            <button type="submit">Entrar</button>

        </form>

        <p class="voltar">
            <a href="index.html">Voltar para a loja</a>
        </p>

    </div>

    <script>
        const formulario = document.getElementById("form-login");
        const senha = document.getElementById("senha");
        const mostrarSenha = document.getElementById("mostrarSenha");

        mostrarSenha.addEventListener("change", function() {
            if (mostrarSenha.checked) {
                senha.type = "text";
            } else {
                senha.type = "password";
            }
        });

        formulario.addEventListener("submit", function(event) {
            event.preventDefault();

            alert("Login demonstrativo realizado com sucesso!");
        });
    </script>

</body>
</html>
